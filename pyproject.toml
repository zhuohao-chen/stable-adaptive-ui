[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stableui"
version = "0.1.0"
description = "Benchmarking optimization algorithms for stable adaptive mobile user interfaces (COSC 520 project)."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Cisco Chen" },
    { name = "Iverson Yuan" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "ortools>=9.10",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
demo = ["streamlit>=1.30"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
